name: Probe sources and relays

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe every source and relay
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          ORIGIN='https://0xmortuex.github.io'
          probe() {
            local name="$1" url="$2"
            local meta body acao
            meta=$(curl -sS -o /tmp/body -D /tmp/headers -w '%{http_code} in %{time_total}s' --max-time 25 \
              -H 'Accept: application/json' -H "Origin: $ORIGIN" -A "$UA" "$url" 2>&1 | tail -1)
            body=$(head -c 120 /tmp/body | tr '\n\r' '  ')
            acao=$(grep -i '^access-control-allow-origin' /tmp/headers | tr -d '\r' || true)
            printf '=== %-18s %s | %s\n    body: %s\n' "$name" "$meta" "${acao:-no-ACAO}" "$body"
            : > /tmp/body
          }
          MD='https://api.mangadex.org/manga?limit=1'
          CK='https://api.comick.fun/v1.0/search?q=naruto&limit=1&tachiyomi=true'
          ENC_MD=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$MD")

          echo '--- direct sources (WITH Origin header: ACAO presence is the CORS truth) ---'
          probe md-ping 'https://api.mangadex.org/ping'
          probe md-manga "$MD"
          probe md-manga-retry "$MD"
          probe ck-search "$CK"
          probe jikan-top 'https://api.jikan.moe/v4/top/manga?limit=5'
          probe kitsu 'https://kitsu.io/api/edge/manga?page%5Blimit%5D=1'

          echo '--- relay candidates wrapping the mangadex URL ---'
          probe allorigins-raw "https://api.allorigins.win/raw?url=$ENC_MD"
          probe allorigins-json "https://api.allorigins.win/get?url=$ENC_MD"
          probe codetabs "https://api.codetabs.com/v1/proxy?quest=$ENC_MD"
          probe test-cors-wd "https://test.cors.workers.dev/?$MD"
          probe corsproxy-org "https://corsproxy.org/?url=$ENC_MD"
          probe corsmirror "https://corsmirror.com/v1?url=$ENC_MD"
          probe corsfix "https://proxy.corsfix.com/?$MD"
          probe jina-reader "https://r.jina.ai/$MD"
          probe whateverorigin "http://www.whateverorigin.org/get?url=$ENC_MD"
