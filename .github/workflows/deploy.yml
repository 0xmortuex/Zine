name: Deploy to GitHub Pages

on:
  push:
    # Deploys from the current default branch; keep main listed so the
    # workflow keeps working if the repo is ever switched over to it.
    branches: [main, claude/manga-reader-scaffold-byy4by]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Project sites are served from /<repo>/ — bake that into asset
          # URLs and the router basename. For a custom domain or a
          # <user>.github.io root site, change this to /
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages' deployment queue can be slow; the 10-minute default
          # timeout has aborted otherwise-healthy deployments.
          timeout: 1800000
